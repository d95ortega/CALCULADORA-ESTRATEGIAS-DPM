        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #root:empty::after {
            content: ""; width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #ec3237; border-radius: 50%;
            animation: spin 1s linear infinite; position: absolute; top: 50%; left: 50%;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .pdf-capture-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 850px;
            background: white;
            z-index: -100;
        }

        /* Suavizado para iOS */
        @supports (-webkit-touch-callout: none) {
            .min-h-screen { min-height: -webkit-fill-available; }
        }
    </style>
