
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculadora DPM - App Profesional</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DPM Costos">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ec3237">
    
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #root:empty::after {
            content: ""; width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #ec3237; border-radius: 50%;
            animation: spin 1s linear infinite; position: absolute; top: 50%; left: 50%;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .pdf-capture-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 850px;
            background: white;
            z-index: -100;
        }

        /* Suavizado para iOS */
        @supports (-webkit-touch-callout: none) {
            .min-h-screen { min-height: -webkit-fill-available; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
      // Automatically clean up and unregister any stale service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function() {
              console.log('Successfully unregistered stale service worker:', registration);
            });
          }
        }).catch(function(err) {
          console.error('Error unregistering service workers:', err);
        });
      }
    </script>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
